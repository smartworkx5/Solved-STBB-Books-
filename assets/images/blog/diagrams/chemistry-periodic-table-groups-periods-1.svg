<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="698" viewBox="0 0 1000 698">
<rect width="1000" height="698" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="40" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Map of the Periodic Table</text>
<rect x="350" y="228" width="300" height="76" rx="14" fill="#0B6B4A"/>
<text x="500" y="264" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Periodic Table</text>
<line x1="180" y1="264" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="60" y="128" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="180" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Metals (left)</text>
<text x="180" y="186" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Shiny, conductive; tend to</text>
<text x="180" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">lose electrons and form</text>
<text x="180" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">positive ions.</text>
<line x1="820" y1="264" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="700" y="128" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="820" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Non-metals (right)</text>
<text x="820" y="186" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Dull, poor conductors;</text>
<text x="820" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">tend to gain or share</text>
<text x="820" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">electrons.</text>
<line x1="180" y1="484" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="60" y="348" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="180" y="378" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Metalloids (staircase)</text>
<text x="180" y="406" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Mixed properties; silicon</text>
<text x="180" y="433" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">and boron sit on the</text>
<text x="180" y="460" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">dividing line.</text>
<line x1="820" y1="484" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="700" y="348" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="820" y="378" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Groups (columns)</text>
<text x="820" y="406" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Same number of outer</text>
<text x="820" y="433" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">electrons, so similar</text>
<text x="820" y="460" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">behaviour.</text>
<line x1="180" y1="704" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="60" y="568" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="180" y="598" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Periods (rows)</text>
<text x="180" y="626" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Same number of shells;</text>
<text x="180" y="653" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">outer electrons increase</text>
<text x="180" y="680" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">across a row.</text>
</svg>
