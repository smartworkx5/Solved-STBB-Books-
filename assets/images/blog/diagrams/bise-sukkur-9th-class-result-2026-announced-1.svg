<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810">
<rect width="1000" height="810" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="40" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Check Your BISE Sukkur 9th Class Result 2026 in Five</text>
<text x="40" y="94" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Steps</text>
<rect x="140" y="144" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="176" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Open the board website</text>
<text x="500" y="210" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Go to bisesuksindh.edu.pk and select Results</text>
<polygon points="500,242 486,264 514,264" fill="#F59E0B"/>
<rect x="140" y="272" width="720" height="124" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="304" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Find SSC Part-I 2026</text>
<text x="500" y="338" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Look for Secondary School Certificate Part-I, 1st Annual</text>
<text x="500" y="366" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Examination 2026</text>
<polygon points="500,400 486,422 514,422" fill="#F59E0B"/>
<rect x="140" y="430" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="462" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Pick district and group</text>
<text x="500" y="496" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Open the gazette PDF for your district and group</text>
<polygon points="500,528 486,550 514,550" fill="#F59E0B"/>
<rect x="140" y="558" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="590" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Search your seat number</text>
<text x="500" y="624" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Press Ctrl+F in the PDF and type your seat number exactly</text>
<polygon points="500,656 486,678 514,678" fill="#F59E0B"/>
<rect x="140" y="686" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="718" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Read and save</text>
<text x="500" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Read the passing heading above your number and save the page</text>
</svg>
