<text x="500" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Circle who or what performs the action</text>
<polygon points="500,462 486,484 514,484" fill="#F59E0B"/>
