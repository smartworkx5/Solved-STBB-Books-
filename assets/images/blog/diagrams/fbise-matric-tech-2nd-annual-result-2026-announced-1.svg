<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780">
<rect width="1000" height="780" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="40" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Check Your FBISE Matric Tech Result 2026 in Five</text>
<text x="40" y="94" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Steps</text>
<rect x="140" y="144" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="176" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Open the official portal</text>
<text x="500" y="210" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Go to result.fbise.edu.pk, which opens the FBISE results page</text>
<polygon points="500,242 486,264 514,264" fill="#F59E0B"/>
<rect x="140" y="272" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="304" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Pick your class</text>
<text x="500" y="338" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Choose SSC-I or SSC-II (MATRIC-TECH) 2nd Annual</text>
<polygon points="500,370 486,392 514,392" fill="#F59E0B"/>
<rect x="140" y="400" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="432" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Enter your roll number</text>
<text x="500" y="466" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Type it exactly as printed on your slip</text>
<polygon points="500,498 486,520 514,520" fill="#F59E0B"/>
<rect x="140" y="528" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="560" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">View your result</text>
<text x="500" y="594" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Check your marks and pass or fail status</text>
<polygon points="500,626 486,648 514,648" fill="#F59E0B"/>
<rect x="140" y="656" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="688" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Save a copy</text>
<text x="500" y="722" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Print or save the page for your record</text>
</svg>
