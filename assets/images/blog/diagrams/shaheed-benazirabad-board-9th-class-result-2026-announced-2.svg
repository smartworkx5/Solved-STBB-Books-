<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="734" viewBox="0 0 1000 734">
<rect width="1000" height="734" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="40" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Reading Your Class 9 Result Under the New Grading</text>
<text x="40" y="94" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Rule</text>
<rect x="350" y="264" width="300" height="76" rx="14" fill="#0B6B4A"/>
<text x="500" y="300" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Your Class 9 Result</text>
<line x1="180" y1="300" x2="500" y2="302" stroke="#D1D5DB" stroke-width="2"/>
<rect x="60" y="164" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="180" y="194" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">All Papers Graded</text>
<text x="180" y="222" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">You passed every subject</text>
<text x="180" y="249" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">and can move on to Class</text>
<text x="180" y="276" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">10 admission.</text>
<line x1="820" y1="300" x2="500" y2="302" stroke="#D1D5DB" stroke-width="2"/>
<rect x="700" y="164" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="820" y="194" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Some Papers Ungraded</text>
<text x="820" y="222" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Below 40 per cent in a</text>
<text x="820" y="249" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">paper means Ungraded in</text>
<text x="820" y="276" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">that paper only.</text>
<line x1="180" y1="492" x2="500" y2="302" stroke="#D1D5DB" stroke-width="2"/>
<rect x="60" y="384" width="240" height="108" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="180" y="414" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Passed Papers Stand</text>
<text x="180" y="442" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">You do not repeat papers</text>
<text x="180" y="469" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">you already passed.</text>
<line x1="820" y1="520" x2="500" y2="302" stroke="#D1D5DB" stroke-width="2"/>
<rect x="700" y="384" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="820" y="414" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Next Step</text>
<text x="820" y="442" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Ask your school about the</text>
<text x="820" y="469" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">bi-annual session for the</text>
<text x="820" y="496" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">remaining papers.</text>
</svg>
