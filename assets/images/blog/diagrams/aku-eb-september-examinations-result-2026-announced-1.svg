<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840">
<rect width="1000" height="840" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="40" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Check Your AKU-EB September 2026 Result Online in</text>
<text x="40" y="94" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Five Steps</text>
<rect x="140" y="144" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="176" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Open the board portal</text>
<text x="500" y="210" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Go to examinationboard.aku.edu and click Check Results</text>
<polygon points="500,242 486,264 514,264" fill="#F59E0B"/>
<rect x="140" y="272" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="304" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Candidate Results tab</text>
<text x="500" y="338" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Stay on the tab for individual students, not School Results</text>
<polygon points="500,370 486,392 514,392" fill="#F59E0B"/>
<rect x="140" y="400" width="720" height="94" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="432" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Pick September 2026</text>
<text x="500" y="466" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Select the September Examinations 2026 session, SSC or HSSC</text>
<polygon points="500,498 486,520 514,520" fill="#F59E0B"/>
<rect x="140" y="528" width="720" height="124" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="560" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Enter roll number and DOB</text>
<text x="500" y="594" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Type your roll number exactly as on your admit card and select</text>
<text x="500" y="622" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">your date of birth</text>
<polygon points="500,656 486,678 514,678" fill="#F59E0B"/>
<rect x="140" y="686" width="720" height="124" rx="12" fill="#E7F4EC" stroke="#0B6B4A" stroke-width="2"/>
<text x="500" y="718" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">View and save</text>
<text x="500" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Press View Results, read every subject, and print your marks</text>
<text x="500" y="780" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">slip</text>
</svg>
