<text x="500" y="302" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Consignments move toward the districts</text>
<polygon points="500,334 486,356 514,356" fill="#F59E0B"/>
