<text x="500" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B6B4A" text-anchor="middle">STBB prepares the books</text>
<text x="500" y="174" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle">Textbooks published for the school year</text>
<polygon points="500,206 486,228 514,228" fill="#F59E0B"/>
