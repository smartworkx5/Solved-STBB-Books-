<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="698" viewBox="0 0 1000 698">
<rect width="1000" height="698" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="40" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Building the Madani Community</text>
<rect x="350" y="228" width="300" height="76" rx="14" fill="#0B6B4A"/>
<text x="500" y="264" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">One Community in Madinah</text>
<line x1="180" y1="264" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="60" y="128" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="180" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Unity</text>
<text x="180" y="186" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Muhajirun and Ansar became</text>
<text x="180" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">one Ummah, bound by faith</text>
<text x="180" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">and brotherhood.</text>
<line x1="820" y1="264" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="700" y="128" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="820" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Justice</text>
<text x="820" y="186" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Disputes were referred to</text>
<text x="820" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Allah and His Messenger</text>
<text x="820" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">for fair settlement.</text>
<line x1="180" y1="512" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="60" y="348" width="240" height="164" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="180" y="378" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Protection</text>
<text x="180" y="406" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">All residents shared</text>
<text x="180" y="433" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">responsibility for</text>
<text x="180" y="460" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">defending the city</text>
<text x="180" y="487" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">together.</text>
<line x1="820" y1="484" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="700" y="348" width="240" height="136" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="820" y="378" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Freedom</text>
<text x="820" y="406" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Each group kept its faith</text>
<text x="820" y="433" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">while living under common</text>
<text x="820" y="460" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">civic duties.</text>
</svg>
