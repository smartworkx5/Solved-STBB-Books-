<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="698" viewBox="0 0 1000 698">
<rect width="1000" height="698" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="40" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">What Command Words Ask You to Do</text>
<rect x="350" y="228" width="300" height="76" rx="14" fill="#0B6B4A"/>
<text x="500" y="264" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Command word</text>
<line x1="180" y1="236" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="60" y="128" width="240" height="108" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="180" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Describe</text>
<text x="180" y="186" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Say what it is, in clear</text>
<text x="180" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">detail</text>
<line x1="820" y1="208" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="700" y="128" width="240" height="80" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="820" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Explain</text>
<text x="820" y="186" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Say why and how it works</text>
<line x1="180" y1="456" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="60" y="348" width="240" height="108" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="180" y="378" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Compare</text>
<text x="180" y="406" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Show similarities and</text>
<text x="180" y="433" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">differences</text>
<line x1="820" y1="456" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="700" y="348" width="240" height="108" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="820" y="378" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">List</text>
<text x="820" y="406" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Give short points, one by</text>
<text x="820" y="433" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">one</text>
<line x1="180" y1="676" x2="500" y2="266" stroke="#D1D5DB" stroke-width="2"/>
<rect x="60" y="568" width="240" height="108" rx="12" fill="#E7F4EC" stroke="#0B6B4A"/>
<text x="180" y="598" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6B4A" text-anchor="middle">Suggest</text>
<text x="180" y="626" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">Offer an idea with a</text>
<text x="180" y="653" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#6B7280" text-anchor="middle">reason</text>
