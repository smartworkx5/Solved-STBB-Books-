<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424">
<rect width="1000" height="424" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="40" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0B6B4A" text-anchor="start">Boyle&#x27;s Law Versus Charles&#x27;s Law</text>
<rect x="40" y="108" width="440" height="52" rx="8" fill="#0B6B4A"/>
<rect x="520" y="108" width="440" height="52" rx="8" fill="#F59E0B"/>
<text x="260" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Boyle&#x27;s Law</text>
<text x="740" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1F2937" text-anchor="middle">Charles&#x27;s Law</text>
<rect x="40" y="160" width="920" height="54" fill="#F7FAF8" stroke="#D1D5DB"/>
<text x="60" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2937" text-anchor="start">Temperature stays fixed</text>
<text x="540" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2937" text-anchor="start">Pressure stays fixed</text>
<rect x="40" y="214" width="920" height="82" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="60" y="244" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2937" text-anchor="start">Pressure and volume move</text>
<text x="60" y="272" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2937" text-anchor="start">oppositely</text>
<text x="540" y="244" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2937" text-anchor="start">Volume and temperature move</text>
<text x="540" y="272" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2937" text-anchor="start">together</text>
<rect x="40" y="296" width="920" height="54" fill="#F7FAF8" stroke="#D1D5DB"/>
<text x="60" y="326" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2937" text-anchor="start">Formula: P1V1 = P2V2</text>
<text x="540" y="326" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2937" text-anchor="start">Formula: V1/T1 = V2/T2</text>
<rect x="40" y="350" width="920" height="54" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="60" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2937" text-anchor="start">Example: squeezing a balloon</text>
<text x="540" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2937" text-anchor="start">Example: heating a balloon</text>
</svg>
