<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: #f4f6f8; color: #17202a; }
  main { max-width: 860px; margin: 0 auto; padding: 18px; }
  .card { background: #fff; border-radius: 12px; padding: 18px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  button { font: inherit; border: 0; border-radius: 8px; cursor: pointer;
           padding: 9px 14px; }
  .primary { background: #444; color: #fff; font-weight: 600; }
  .allow { background: #1e8e3e; color: #fff; }
  .block { background: #b03a2e; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 8px; border-bottom: 1px solid #edf1f3; text-align: left;
           vertical-align: top; }
  .chip { padding: 2px 9px; border-radius: 20px; color: #fff; font-size: 12px;
          font-weight: 700; }
  .chip.yes { background: #1e8e3e; } .chip.no { background: #b03a2e; }
  .hint { color: #5d6d7e; font-size: 13px; line-height: 1.5; }
  .error { color: #8b1a10; background: #fdecea; border-radius: 8px;
           padding: 10px 12px; display: none; margin-bottom: 12px; }
</style>
</head>
<body>
<main>
  <div class="card" id="loginCard">
    <div class="error" id="errBox"></div>
    <button class="primary" id="btnLogin">Sign in with Google</button>
    <p class="hint" id="cfgNote"></p>
  </div>

  <div class="card" id="panelCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">Signed-in users</h2>
      <button id="btnLogout">Sign out</button>
    </div>
    <p class="hint">Allow = the app opens for this person.
      Block = the app stays locked for them.</p>
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Last sign-in</th>
      <th>Status</th><th>Action</th></tr></thead>
      <tbody id="userRows"></tbody>
    </table>
    <p class="hint" id="emptyNote">No users have signed in yet.</p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function () {
  var OWNER_EMAIL = "tasleemsanjrani.xd@gmail.com";
  var errBox = document.getElementById("errBox");
  function fail(msg) {
    errBox.style.display = "block";
    errBox.textContent = msg;
  }
  if (!window.FIREBASE_CONFIG) {
    document.getElementById("cfgNote").textContent = "Setup pending.";
    document.getElementById("btnLogin").disabled = true;
    return;
  }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  var auth = firebase.auth();
  var db = firebase.firestore();

  document.getElementById("btnLogin").addEventListener("click", function () {
    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(function (e) { fail(e.message); });
  });
  document.getElementById("btnLogout").addEventListener("click", function () {
    auth.signOut();
  });

  auth.onAuthStateChanged(function (user) {
    var panel = document.getElementById("panelCard");
    var login = document.getElementById("loginCard");
    if (!user) { panel.style.display = "none"; login.style.display = "block"; return; }
    if ((user.email || "").toLowerCase() !== OWNER_EMAIL) {
      fail("Access denied.");
      auth.signOut();
      return;
    }
    login.style.display = "none";
    panel.style.display = "block";
    db.collection("users").orderBy("lastSignIn", "desc")
      .onSnapshot(function (snap) {
        var tbody = document.getElementById("userRows");
        tbody.innerHTML = "";
        document.getElementById("emptyNote").style.display =
          snap.empty ? "block" : "none";
        snap.forEach(function (doc) {
          var d = doc.data();
          var tr = document.createElement("tr");
          var when = d.lastSignIn ? new Date(d.lastSignIn).toLocaleString() : "—";
          tr.innerHTML = "<td></td><td></td><td></td><td></td><td></td>";
          tr.children[0].textContent = d.displayName || "—";
          tr.children[1].textContent = d.email || "—";
          tr.children[2].textContent = when;
          var chip = document.createElement("span");
          chip.className = "chip " + (d.authorized ? "yes" : "no");
          chip.textContent = d.authorized ? "ALLOWED" : "BLOCKED";
          tr.children[3].appendChild(chip);
          var btn = document.createElement("button");
          btn.className = d.authorized ? "block" : "allow";
          btn.textContent = d.authorized ? "Block" : "Allow";
          btn.addEventListener("click", function () {
            btn.disabled = true;
            db.collection("users").doc(doc.id)
              .update({ authorized: !d.authorized })
              .catch(function (e) { fail(e.message); btn.disabled = false; });
          });
          tr.children[4].appendChild(btn);
          tbody.appendChild(tr);
        });
      }, function (e) { fail("Could not load users: " + e.message); });
  });
})();
</script>
</body>
</html>
